<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste </title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
         table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto; /* Center the table */
            border-collapse: collapse; 
        }

        table caption{
            background-color: lightslategray;
            font: 25px Arial, sans-serif;
            text-align: center;
            padding: 5px;
            
        }
        
        table th{
            width: 400px;
            text-align: center;
            background-color: lightgray;
            color: black;
            font-weight: bold;
            padding: 5px;
            border: 1px solid black;
        }
        table td{
            width: 400px;
            text-align: center;
            padding: 5px;
            border: 1px solid black;
        }

        .cidade_modelo{
            background-color: yellow;
            color: red;
        }

        p{
            text-align: center;
        }
       
    </style>
</head>
<body>
    <table>
        <caption>Tabela de Exemplo</caption>
        
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>

        <tr>
            <td>João</td>
            <td>25</td>
            <td>São Paulo</td>
        </tr>

        <tr>
            <td>Maria</td>
            <td>30</td>
            <td>Rio de Janeiro</td>
        </tr>

        <tr>
            <td>Pedro</td>
            <td>35</td>
            <td class="cidade_modelo">Belo Horizonte</td>
        </tr>

    </table>

    <p>Agora entendi ;)</p>
</body>
</html>
