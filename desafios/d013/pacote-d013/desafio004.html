<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table {
            width: 500px;
            border-collapse: collapse;
        }
        th{
            background-color: gray;
            color: white;
            font-weight: bold;
            text-align: center;
            border: 1px solid black;
            padding: 5px;
        }

        td{
            border: 1px solid black;
            text-align: center;
            padding: 5px;
            
        }

    </style>
</head>
<body>
    <table>
    <tr>
        <th rowspan="2">Área</th>
        <th rowspan="2">Disciplinas</th>
        <th colspan="2">Notas</th>
        <th rowspan="2">Média</th>
    </tr>   

    <tr>
        <th>Nota 1</th>
        <th>Nota 2</th>  
    </tr>
    <tr>
        <th style="background-color: white; color: black;" rowspan="3">Exatas</th>
        <td>Matemática</td>
        <td>0.0</td>    
        <td>0.0</td>
        <td>0.0
    </tr>

    <tr>
        <td>Física</td>    
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>

    <tr>
        <td>Química</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>

    <tr>
        <th style="text-align: left;" colspan="4">Média de Exatas</th>
        <td style="background-color: gray; color: white;">0.0</td>
    </tr>

    <tr>
        <th style="background-color: white; color: black;" rowspan="2">Humanas</th>
        <td>história</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>
    <tr>
        <td>Geografia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
    </tr>
    <th style="text-align: left;" colspan="4">Média de Humanas</th>
    <td style="background-color: gray; color: white;">0.0</td>
    


       
    </table>

</body>
</html>
